<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Animated diagram: Power to IoT to Web" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" rx="20" fill="url(#pbg)"/>
  <text x="450" y="30" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="16" font-weight="bold" fill="#94a3b8">POWER  &#8594;  IoT  &#8594;  WEB</text>

  <!-- connectors -->
  <g stroke="#6366f1" stroke-width="2" stroke-dasharray="6 6" opacity="0.8">
    <line x1="182" y1="100" x2="402" y2="100"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/></line>
    <line x1="498" y1="100" x2="722" y2="100"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/></line>
  </g>
  <!-- packets -->
  <g fill="#f8fafc">
    <circle r="5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M182 100 L402 100"/></circle>
    <circle r="5"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M182 100 L402 100"/></circle>
    <circle r="5"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" path="M498 100 L722 100"/></circle>
    <circle r="5"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" path="M498 100 L722 100"/></circle>
  </g>

  <!-- node 1: power -->
  <circle cx="130" cy="100" r="46" fill="none" stroke="#fbbf24" stroke-width="2">
    <animate attributeName="r" values="46;62" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="100" r="46" fill="#fbbf24"/>
  <polygon points="136,70 114,104 128,104 123,130 148,94 132,94" fill="#0f172a">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.2s" repeatCount="indefinite"/>
  </polygon>

  <!-- node 2: IoT chip -->
  <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
    <line x1="402" y1="76" x2="414" y2="76"/><line x1="402" y1="92" x2="414" y2="92"/><line x1="402" y1="108" x2="414" y2="108"/><line x1="402" y1="124" x2="414" y2="124"/>
    <line x1="486" y1="76" x2="498" y2="76"/><line x1="486" y1="92" x2="498" y2="92"/><line x1="486" y1="108" x2="498" y2="108"/><line x1="486" y1="124" x2="498" y2="124"/>
  </g>
  <rect x="410" y="58" width="80" height="84" rx="14" fill="#38bdf8"/>
  <rect x="428" y="76" width="44" height="48" rx="8" fill="#0f172a"/>
  <circle cx="450" cy="100" r="6" fill="#67e8f9">
    <animate attributeName="opacity" values="1;0.15;1" dur="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- node 3: web dashboard -->
  <rect x="730" y="54" width="92" height="92" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
  <rect x="730" y="54" width="92" height="20" rx="12" fill="#34d399"/>
  <circle cx="744" cy="64" r="3" fill="#0f172a"/><circle cx="755" cy="64" r="3" fill="#0f172a"/><circle cx="766" cy="64" r="3" fill="#0f172a"/>
  <g fill="#67e8f9">
    <rect x="744" y="110" width="14" height="24"><animate attributeName="height" values="12;40;12" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="134;106;134" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="765" y="110" width="14" height="24" fill="#a78bfa"><animate attributeName="height" values="36;14;36" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="134;134;134" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="786" y="110" width="14" height="24" fill="#fbbf24"><animate attributeName="height" values="20;44;20" dur="1.6s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="134;102;134" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></rect>
  </g>

  <!-- labels -->
  <g font-family="'Courier New', Consolas, monospace" font-size="15" font-weight="bold" text-anchor="middle">
    <text x="130" y="186" fill="#fbbf24">Power</text>
    <text x="130" y="205" font-size="12" font-weight="normal" fill="#94a3b8">what I study</text>
    <text x="450" y="186" fill="#38bdf8">IoT</text>
    <text x="450" y="205" font-size="12" font-weight="normal" fill="#94a3b8">what I love building</text>
    <text x="776" y="186" fill="#34d399">Web</text>
    <text x="776" y="205" font-size="12" font-weight="normal" fill="#94a3b8">simple sites &amp; dashboards</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
