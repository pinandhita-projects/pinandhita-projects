<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Auto-playing mini game: Power Runner dodges short circuits" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <clipPath id="gclip"><rect width="900" height="260" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#gclip)">
    <rect width="900" height="260" fill="url(#gbg)"/>

    <!-- stars -->
    <g fill="#e0e7ff">
      <circle cx="80" cy="50" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="30" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="60" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="36" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="80" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="1.4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- HUD -->
    <text x="24" y="34" font-family="'Courier New', Consolas, monospace" font-size="16" font-weight="bold" fill="#f8fafc">POWER RUNNER <tspan fill="#94a3b8" font-weight="normal">· auto-play demo</tspan></text>
    <text x="640" y="34" font-family="'Courier New', Consolas, monospace" font-size="14" fill="#fbbf24">POWER LEVEL</text>
    <rect x="750" y="21" width="126" height="16" rx="8" fill="#1e293b"/>
    <rect x="752" y="23" width="0" height="12" rx="6" fill="#fbbf24">
      <animate attributeName="width" values="0;122" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- transmission towers (parallax) -->
    <g stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round">
      <g>
        <animateTransform attributeName="transform" type="translate" from="900 0" to="-60 0" dur="12s" repeatCount="indefinite"/>
        <path d="M0 200 L20 90 L40 200 M8 130 L32 130 M12 108 L28 108 M2 160 L38 160"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" from="900 0" to="-60 0" dur="12s" begin="-4s" repeatCount="indefinite"/>
        <path d="M0 200 L20 90 L40 200 M8 130 L32 130 M12 108 L28 108 M2 160 L38 160"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" from="900 0" to="-60 0" dur="12s" begin="-8s" repeatCount="indefinite"/>
        <path d="M0 200 L20 90 L40 200 M8 130 L32 130 M12 108 L28 108 M2 160 L38 160"/>
      </g>
    </g>

    <!-- ground -->
    <rect x="0" y="200" width="900" height="60" fill="#1e1b4b"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke="#6366f1" stroke-width="3"/>
    <line x1="0" y1="226" x2="900" y2="226" stroke="#4f46e5" stroke-width="3" stroke-dasharray="18 14">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="0.2s" repeatCount="indefinite"/>
    </line>

    <!-- hazard A : short circuit -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="900 0" to="-60 0" dur="6s" repeatCount="indefinite"/>
      <path d="M0 200 L15 168 L30 200 Z" fill="#ef4444"/>
      <rect x="13.5" y="180" width="3" height="10" rx="1.5" fill="#fff"/>
      <circle cx="15" cy="195" r="1.8" fill="#fff"/>
      <polygon points="17,118 9,134 15,134 12,148 22,130 16,130" fill="#fde047">
        <animate attributeName="opacity" values="1;0.4;1" dur="0.5s" repeatCount="indefinite"/>
      </polygon>
    </g>
    <!-- hazard B : overloaded capacitor -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="900 0" to="-60 0" dur="6s" begin="-3s" repeatCount="indefinite"/>
      <rect x="0" y="172" width="24" height="28" rx="4" fill="#f59e0b"/>
      <rect x="0" y="180" width="24" height="5" fill="#b45309"/>
      <line x1="12" y1="172" x2="12" y2="160" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
      <polygon points="14,118 6,134 12,134 9,148 19,130 13,130" fill="#fde047">
        <animate attributeName="opacity" values="1;0.4;1" dur="0.5s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- player: jumps over each hazard -->
    <g transform="translate(120 0)">
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0;0 0;0 -85;0 0;0 0;0 -85;0 0;0 0"
          keyTimes="0;0.2;0.2917;0.3833;0.7;0.7917;0.8833;1"
          calcMode="spline"
          keySplines="0 0 1 1;0.2 0.6 0.4 1;0.6 0 0.8 0.4;0 0 1 1;0.2 0.6 0.4 1;0.6 0 0.8 0.4;0 0 1 1"
          dur="6s" repeatCount="indefinite"/>
        <!-- legs -->
        <rect x="9" y="186" width="7" height="14" rx="3" fill="#818cf8">
          <animateTransform attributeName="transform" type="rotate" values="-25 12 186;25 12 186;-25 12 186" dur="0.3s" repeatCount="indefinite"/>
        </rect>
        <rect x="25" y="186" width="7" height="14" rx="3" fill="#818cf8">
          <animateTransform attributeName="transform" type="rotate" values="25 28 186;-25 28 186;25 28 186" dur="0.3s" repeatCount="indefinite"/>
        </rect>
        <!-- antenna -->
        <line x1="20" y1="150" x2="20" y2="140" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
        <circle cx="20" cy="138" r="4" fill="#f43f5e"><animate attributeName="r" values="3;5;3" dur="0.6s" repeatCount="indefinite"/></circle>
        <!-- body -->
        <rect x="0" y="150" width="40" height="38" rx="11" fill="#38bdf8"/>
        <rect x="6" y="156" width="28" height="18" rx="6" fill="#0f172a"/>
        <ellipse cx="14" cy="165" rx="3.5" ry="3.5" fill="#67e8f9">
          <animate attributeName="ry" values="3.5;3.5;0.6;3.5;3.5" keyTimes="0;0.9;0.94;0.98;1" dur="3s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="26" cy="165" rx="3.5" ry="3.5" fill="#67e8f9">
          <animate attributeName="ry" values="3.5;3.5;0.6;3.5;3.5" keyTimes="0;0.9;0.94;0.98;1" dur="3s" repeatCount="indefinite"/>
        </ellipse>
        <circle cx="20" cy="181" r="3" fill="#fde047"/>
      </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
