<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 40" width="900" height="40" role="img" aria-label="Animated data packet traveling between IoT nodes" xmlns:c2pa="http://c2pa.org/manifest">
  <line x1="60" y1="20" x2="840" y2="20" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 6" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/>
  </line>
  <g fill="#38bdf8">
    <circle cx="60" cy="20" r="8"><animate attributeName="r" values="7;10;7" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="255" cy="20" r="8" fill="#a78bfa"><animate attributeName="r" values="7;10;7" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="20" r="8" fill="#34d399"><animate attributeName="r" values="7;10;7" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="645" cy="20" r="8" fill="#fbbf24"><animate attributeName="r" values="7;10;7" dur="2s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="20" r="8" fill="#f472b6"><animate attributeName="r" values="7;10;7" dur="2s" begin="2s" repeatCount="indefinite"/></circle>
  </g>
  <circle r="5" fill="#f8fafc">
    <animateMotion dur="4s" repeatCount="indefinite" path="M60 20 L840 20"/>
  </circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
